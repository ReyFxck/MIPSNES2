name: Emulator bug
description: Reproducible emulator or foundation problem
body:
- type: markdown
  attributes:
    value: Do not upload commercial ROMs. A title screen is not proof of compatibility.
      Distinguish real hardware from PCSX2/PPSSPP. Unknown measurements should say
      unknown.
- type: input
  id: field-1
  attributes:
    label: Affected game or test
  validations:
    required: true
- type: input
  id: field-2
  attributes:
    label: Platform
  validations:
    required: true
- type: input
  id: field-3
  attributes:
    label: Real hardware or emulator, model/version/settings
  validations:
    required: true
- type: input
  id: field-4
  attributes:
    label: Commit or version
  validations:
    required: true
- type: textarea
  id: field-5
  attributes:
    label: Reproduction steps
  validations:
    required: true
- type: textarea
  id: field-6
  attributes:
    label: Expected and actual behavior
  validations:
    required: true
- type: textarea
  id: field-7
  attributes:
    label: Logs (no commercial ROMs)
  validations:
    required: false
- type: input
  id: field-8
  attributes:
    label: Suspected subsystem, if known
  validations:
    required: false
