name: Performance report
description: Measured behavior on an identified device
body:
- type: markdown
  attributes:
    value: Do not upload commercial ROMs. A title screen is not proof of compatibility.
      Distinguish real hardware from PCSX2/PPSSPP. Unknown measurements should say
      unknown.
- type: input
  id: field-1
  attributes:
    label: Platform
  validations:
    required: true
- type: input
  id: field-2
  attributes:
    label: Real hardware or emulator, model/version/settings
  validations:
    required: true
- type: input
  id: field-3
  attributes:
    label: Game or test
  validations:
    required: true
- type: input
  id: field-4
  attributes:
    label: Commit or version
  validations:
    required: true
- type: input
  id: field-5
  attributes:
    label: FPS/frame time and measurement method
  validations:
    required: true
- type: input
  id: field-6
  attributes:
    label: Frameskip/audio state and duration
  validations:
    required: true
- type: textarea
  id: field-7
  attributes:
    label: Reproduction details
  validations:
    required: true
- type: textarea
  id: field-8
  attributes:
    label: Before/after data, if available
  validations:
    required: false
