name: PS2 CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
env:
  RFAUDS2_REF: f82e0967104fc96f37259e1abc124341eef6a76c
jobs:
  build:
    name: PS2 diagnostic build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Cache pinned upstream archive
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/mipsnes2-toolchains
          key: toolchain-ubuntu24-x64-ps2-${{ hashFiles('tools/toolchains.json') }}
      - name: Install verified toolchain
        run: python3 tools/setup_toolchain.py ps2 "$RUNNER_TEMP/mipsnes2-toolchains" "$HOME/.cache/mipsnes2-toolchains"
      - name: Fetch and build pinned RFAuds2
        env:
          PS2DEV: ${{ runner.temp }}/mipsnes2-toolchains/ps2dev
          PS2SDK: ${{ runner.temp }}/mipsnes2-toolchains/ps2dev/ps2sdk
        run: |
          export PATH="$PS2DEV/bin:$PS2DEV/ee/bin:$PS2DEV/iop/bin:$PATH"
          git init "$RUNNER_TEMP/rfauds2"
          git -C "$RUNNER_TEMP/rfauds2" remote add origin https://github.com/ReyFxck/RFAuds2.git
          git -C "$RUNNER_TEMP/rfauds2" fetch --depth 1 origin "$RFAUDS2_REF"
          git -C "$RUNNER_TEMP/rfauds2" checkout --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/rfauds2" rev-parse HEAD)" = "$RFAUDS2_REF"
          make -C "$RUNNER_TEMP/rfauds2" all PS2DEV="$PS2DEV" PS2SDK="$PS2SDK" PS2SDKSRC="$PS2SDK"
      - name: Cross-compile diagnostic
        env:
          PS2DEV: ${{ runner.temp }}/mipsnes2-toolchains/ps2dev
          PS2SDK: ${{ runner.temp }}/mipsnes2-toolchains/ps2dev/ps2sdk
        run: |
          export PATH="$PS2DEV/bin:$PS2DEV/ee/bin:$PS2DEV/iop/bin:$PATH"
          mips64r5900el-ps2-elf-gcc --version
          make -C platform/ps2 MIPSNES2_RFAUDS2=1 RFAUDS2_ROOT="$RUNNER_TEMP/rfauds2"
      - name: Stage development artifact and checksums
        run: |
          mkdir -p dist
          cp platform/ps2/mipsnes2-ps2.elf dist/
          cp LICENSE tools/toolchains.json dist/
          printf '%s\n' "Commit: $GITHUB_SHA" "Five on-screen core checks; ROM execution unavailable; PS2 runtime unverified." > dist/BUILD.txt
          cd dist
          sha256sum mipsnes2-ps2.elf LICENSE toolchains.json BUILD.txt > SHA256SUMS
          sha256sum -c SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mipsnes2-ps2-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
