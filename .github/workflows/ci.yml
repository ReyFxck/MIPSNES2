name: Host CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  host:
    name: Host (${{ matrix.compiler }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build and test release configuration
        run: make CC=${{ matrix.compiler }} BUILD_DIR=build/release CFLAGS='-O2 -g -DNDEBUG' test
      - name: Build and test with sanitizers
        run: make CC=${{ matrix.compiler }} BUILD_DIR=build/sanitize CFLAGS='-O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer' test
      - name: Stage host development artifact
        run: |
          mkdir -p dist
          cp build/release/mipsnes2-host dist/
          cp LICENSE dist/
          printf '%s\n' "Commit: $GITHUB_SHA" "Foundation only; no SNES emulation." > dist/BUILD.txt
          ${{ matrix.compiler }} --version >> dist/BUILD.txt
          cd dist
          sha256sum mipsnes2-host BUILD.txt LICENSE > SHA256SUMS
          sha256sum -c SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mipsnes2-host-${{ matrix.compiler }}-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
